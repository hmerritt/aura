name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked --all-targets

      - name: Test shader golden images
        env:
          WGPU_BACKEND: dx12
        run: cargo test --locked renderer::golden_tests::portable_shaders_match_legacy_goldens -- --ignored --exact --test-threads=1

      - name: Upload shader golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: shader-golden-failures
          path: target/shader-golden-failures
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    env:
      QSB: /usr/lib/qt6/bin/qsb
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux shader and companion validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-daemon nodejs qt6-declarative-dev-tools qt6-shader-baker

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate companion metadata and source
        run: |
          python3 scripts/linux/validate-companions.py
          node --check --input-type=module < integrations/linux/gnome/extension.js
          /usr/lib/qt6/bin/qmlformat integrations/linux/plasma/contents/ui/main.qml >/dev/null

      - name: Check
        run: cargo check --locked --all-targets

      - name: Test
        run: cargo test --locked --all-targets

      - name: Test private session bus integration
        run: dbus-run-session -- env AURA_TEST_PRIVATE_BUS=1 cargo test --locked linux_desktop::tests::private_session_bus_roundtrip_and_single_instance_rejection -- --exact

      - name: Build release and all shader targets
        run: cargo build --release --locked
