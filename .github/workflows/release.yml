name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Tag '$tag' must be numeric SemVer (for example 1.2.3)." >&2
            exit 1
          }
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          [[ "$tag" == "$cargo_version" ]] || {
            echo "Tag '$tag' does not match Cargo.toml version '$cargo_version'." >&2
            exit 1
          }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build_windows:
    needs: validate
    runs-on: windows-latest
    env:
      SQUIRREL_WINDOWS_VERSION: 2.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Install UPX
        run: choco install upx -y

      - name: Install NuGet CLI
        run: choco install nuget.commandline -y

      - name: Compress binary with UPX
        run: upx --best --lzma target\release\aura.exe

      - name: Package standalone artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $exeName = "aura-${{ needs.validate.outputs.version }}-windows.exe"
          Copy-Item target\release\aura.exe "dist\$exeName" -Force
          Compress-Archive -Path "dist\$exeName" -DestinationPath "dist\aura-${{ needs.validate.outputs.version }}-windows.zip" -Force

      - name: Package Squirrel artifacts
        shell: pwsh
        run: |
          .\scripts\windows\package-squirrel.ps1 -Version "${{ needs.validate.outputs.version }}" -SquirrelWindowsVersion "$env:SQUIRREL_WINDOWS_VERSION"

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item "dist\aura-${{ needs.validate.outputs.version }}-windows.exe" release-assets -Force
          Copy-Item "dist\aura-${{ needs.validate.outputs.version }}-windows.zip" release-assets -Force
          Copy-Item "dist\squirrel\aura-${{ needs.validate.outputs.version }}-windows-installer.exe" release-assets -Force
          Copy-Item "dist\squirrel\aura-${{ needs.validate.outputs.version }}-windows-installer.zip" release-assets -Force
          Copy-Item dist\squirrel\RELEASES release-assets -Force
          Copy-Item dist\squirrel\*.nupkg release-assets -Force

      - name: Upload Windows assets
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  build_linux:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      QSB: /usr/lib/qt6/bin/qsb
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils dbus-daemon nodejs qt6-declarative-dev-tools qt6-shader-baker shellcheck

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate scripts and companions
        run: |
          shellcheck install.sh scripts/linux/*.sh
          dash -n install.sh
          python3 scripts/linux/validate-companions.py
          node --check --input-type=module < integrations/linux/gnome/extension.js
          bash scripts/linux/test-installer.sh

      - name: Test
        run: |
          cargo test --locked --all-targets
          dbus-run-session -- env AURA_TEST_PRIVATE_BUS=1 cargo test --locked linux_desktop::tests::private_session_bus_roundtrip_and_single_instance_rejection -- --exact

      - name: Build release
        run: cargo build --release --locked

      - name: Validate and package release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$ARCH"
          ./target/release/aura --version | grep -F "Version $VERSION"
          bash scripts/linux/check-glibc.sh target/release/aura
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            bash scripts/linux/package-release.sh \
              --version "$VERSION" \
              --arch "$ARCH" \
              --binary target/release/aura \
              --output release-assets

      - name: Upload Linux asset
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: release-assets/aura-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  build_macos_arm64:
    needs: validate
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify native Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --all-targets --target aarch64-apple-darwin

      - name: Build release
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Validate and package release
        run: |
          test "$(lipo -archs target/aarch64-apple-darwin/release/aura)" = arm64
          target/aarch64-apple-darwin/release/aura --version | grep -F "Version ${{ needs.validate.outputs.version }}"
          bash scripts/macos/package-release.sh \
            --version "${{ needs.validate.outputs.version }}" \
            --binary target/aarch64-apple-darwin/release/aura \
            --output release-assets

      - name: Upload macOS assets
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: |
            release-assets/aura-macos-arm64.dmg
            release-assets/aura-macos-arm64.tar.gz
          if-no-files-found: error

  publish_draft:
    needs: [validate, build_windows, build_linux, build_macos_arm64]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate Linux release manifest
        run: |
          bash scripts/linux/generate-manifest.sh \
            "${{ needs.validate.outputs.version }}" \
            release-assets \
            release-assets/aura-linux-manifest
          cat release-assets/aura-linux-manifest

      - name: Generate release checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/*
